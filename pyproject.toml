[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smutworks"
version = "0.1.0a4"
description = "A terminal toolkit for organizing and encoding Stash media libraries"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.scripts]
smutworks = "smutworks:main"

[project.urls]
Repository = "https://github.com/thef4tdaddy/SmutWorks"
Issues = "https://github.com/thef4tdaddy/SmutWorks/issues"

[tool.setuptools]
py-modules = ["smutworks", "adult_content_organizer", "configuration", "duplicate_review", "duplicate_batch", "grouped_menu", "encoding_queue", "organizer_features", "organizer_journal", "terminal_dashboard"]

[tool.black]
line-length = 88
target-version = ["py38"]
extend-exclude = '/(build|dist|node_modules)/'

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.8"
files = ["smutworks.py", "adult_content_organizer.py", "configuration.py", "duplicate_review.py", "duplicate_batch.py", "grouped_menu.py", "encoding_queue.py", "organizer_features.py", "organizer_journal.py", "terminal_dashboard.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
