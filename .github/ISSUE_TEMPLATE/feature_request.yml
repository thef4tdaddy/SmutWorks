name: Feature request
description: Suggest an improvement to SmutWorks.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the workflow or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
